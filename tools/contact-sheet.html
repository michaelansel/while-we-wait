<!doctype html>
<!--
  Contact sheet: every card's picture next to its words, for checking that
  each icon depicts what the card says (see "Card art rule" in AGENTS.md).

    python3 -m http.server 8777    # from the repo root
    open http://localhost:8777/tools/contact-sheet.html
      ?game=simon          only that game (comma-separate several)
      ?from=96&n=96        page through big sets
-->
<meta charset="utf-8">
<title>Card contact sheet</title>
<style>
body{font:11px system-ui;margin:6px;background:#fff;color:#222}
.g{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.c{border:1px solid #ddd;padding:3px;display:flex;gap:4px;align-items:center;min-height:44px}
.c .e{font-size:30px;flex:none;width:40px;text-align:center}
.c .e svg{width:38px;height:38px}
.c i{color:#888;font-style:normal;font-size:9px;display:block}
.c.none .e{color:#bbb;font-size:12px}
</style>
<div class="g" id="g"></div>
<script src="../games.js"></script>
<script src="../charades-art.js"></script>
<script>
const q=new URLSearchParams(location.search);
const only=q.get('game')?q.get('game').split(','):null;
const pic=c=>c.art&&ART[c.art]||c.e;
const rows=[];
for(const g of GAMES){
  if(only&&!only.includes(g.id)) continue;
  g.cards.forEach((c,i)=>{
    const kind=c.kind||g.kind;
    if(kind==='choice'){ rows.push([c.a[0],c.a[1],g.id,i+'a']); rows.push([c.b[0],c.b[1],g.id,i+'b']); }
    else if(kind==='reveal') rows.push([c.e,c.name,g.id,i]);
    else rows.push([pic(c),c.k,g.id,i]);
  });
}
const from=+q.get('from')||0, n=+q.get('n')||rows.length;
document.getElementById('g').innerHTML=rows.slice(from,from+n).map(([e,k,id,i])=>
  `<div class="c${e?'':' none'}"><span class="e">${e||'none'}</span><span><i>${id} #${i}</i>${k}</span></div>`).join('');
</script>
